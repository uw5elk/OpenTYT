name: Build MD-UV390 10W firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Статичні перевірки. ОКРЕМА робота, а не крок усередині збірки, з двох причин:
  # вона не потребує ARM-тулчейну (тобто дає відповідь за секунди, поки збірки ще йдуть),
  # і її падіння не заважає роботам нижче вивантажити готовий .bin.
  #
  # Кожна з трьох перевірок з'явилась після реального дефекту, а не "про всяк випадок":
  #   * syntax_check.sh      -- двічі валив CI коментар "RCFG_*/RCTL_*" у rctl_ua.h
  #                             ("*/" закривало блочний коментар); плюс -Werror на неявні
  #                             виклики, щоб прибрана небезпечна функція не повернулась тихо;
  #                             з 2026-09-18 компілює КОЖЕН файл у 3 конфігураціях (як усі три
  #                             job'и збірки нижче: AES0, AES1, UA), бо коміт 90097cc додав
  #                             безумовне звертання до поля stringsTable_t, що існує лише під
  #                             LANGUAGE_BUILD_UKRAINIAN, -- а стара перевірка (один набір
  #                             прапорців, завжди з цим прапорцем) цього не бачила;
  #   * check_menu_widths.py -- підпис "Рівень потуж.":250 не влазив у 16 символів, і
  #                             екран калібрування показував 25 замість 250; згодом той
  #                             самий скрипт (розділ 4, пікселі) знайшов обрізані підказки
  #                             RCFG_HINT і RCTL_SEND_FAILED;
  #   * check_smeter_align.py -- цифри шкали S-метра стояли на піксель лівіше за поділки.
  checks:
    runs-on: ubuntu-latest
    name: перевірки (синтаксис, ширина меню, вирівнювання S-метра)
    steps:
      - uses: actions/checkout@v4
      # Через setup-python, а не системний pip: на свіжих ubuntu-образах системний
      # Python "externally managed", і pip install без --break-system-packages там падає,
      # а сам той прапорець є не в кожній версії pip. Власне середовище надійніше.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Залежності python (Pillow для рендерера екрана + tools/requirements.txt)
        run: pip install pillow -r MDUV380_firmware/tools/requirements.txt
      - name: Синтаксична перевірка хостовим gcc
        run: ./MDUV380_firmware/tools/syntax_check.sh
      - name: Ширина підписів меню
        run: python3 MDUV380_firmware/tools/check_menu_widths.py
      - name: Вирівнювання шкали S-метра
        run: python3 MDUV380_firmware/tools/check_smeter_align.py
      # Кирилиця в .c має бути cp1251, як у шрифті рації. UTF-8 там компілюється мовчки,
      # а на екрані дає кашу -- саме так виглядало сповіщення радіоперевірки до 2026-09-04.
      - name: Кодування рядків
        run: python3 MDUV380_firmware/tools/check_string_encoding.py
      # Хостові тести лежали в репозиторії давно, але в CI не потрапляли, тож фактично
      # не ганялися. Тепер ганяються.
      # Референс стокового формату команд керування: self-test має відтворювати
      # реальні захвати зі стокової TYT байт-у-байт (див. RCTL_COMPAT.md).
      - name: Референс стокових RCTL-команд
        run: python3 MDUV380_firmware/tools/rctl_stock.py
      - name: Хостові тести
        run: ./MDUV380_firmware/tests/run_tests.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        aes: ["0", "1"]
    name: build (ENABLE_AES=${{ matrix.aes }})
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: Build
        working-directory: MDUV380_firmware
        run: make -j$(nproc) ENABLE_AES=${{ matrix.aes }}
      - name: Report size
        working-directory: MDUV380_firmware
        run: arm-none-eabi-size build/openuv380-10w.elf
      # Розвідка docs/recording-feasibility.md (2026-09-19): скільки насправді вільно
      # RAM (128 КБ) і CCMRAM (64 КБ) СТАТИЧНО, і хто саме з'їдає місце -- див.
      # tools/mem_report.py. Для ВСІХ конфігурацій матриці, не лише української:
      # ENABLE_AES/ENABLE_DMR_DATA теж коштують пам'яті, і різниця цікава сама по собі.
      - name: Звіт про пам'ять (RAM/CCMRAM, топ-20 об'єктів)
        working-directory: MDUV380_firmware
        run: python3 tools/mem_report.py build/openuv380-10w.elf --top 20
      - name: Assert codec-merge-capable size
        working-directory: MDUV380_firmware
        run: |
          sz=$(stat -c%s build/openuv380-10w.bin)
          echo "firmware .bin size: $sz bytes"
          # має бути >= зміщення запису кодека (0x6937C) + розмір кодека (0x48BB0) = 728876
          test "$sz" -ge 728876 || { echo "ERROR: .bin too small to receive the AMBE codec merge (FM-only)"; exit 1; }
          echo "OK: reserved codec region present, ready for flash-time merge."
      # .bin і .hex вивантажуємо завжди (потрібні для прошивки); .elf і .map --
      # лише при ручному запуску (workflow_dispatch), бо вони великі (~10 МБ кожен)
      # і потрібні лише для детального розбору пам'яті поза CI-логом.
      # continue-on-error на КОЖНОМУ upload: якщо квоту сховища вичерпано, збірка лишається
      # зеленою, не скасовує сусідні пункти матриці, а перевірки після upload (розмір,
      # українські рядки) однаково виконуються. Сам збій upload видно жовтим у логах кроку.
      # Всі артефакти живуть 2 дні (було 7): квота сховища артефактів перераховується лише
      # раз на 6-12 год, і старі артефакти блокували upload нових збірок ("Artifact storage
      # quota has been hit"). .bin/.hex стискаються максимально (compression-level: 9).
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: openuv380-10w-aes${{ matrix.aes }}
          retention-days: 2
          compression-level: 9
          path: |
            MDUV380_firmware/build/*.bin
            MDUV380_firmware/build/*.hex
      # .elf + .map (налагоджувальні символи і лінкерна карта) -- лише вручну.
      # Запуск: GitHub → Actions → "Build MD-UV390 10W firmware" → Run workflow.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch'
        with:
          name: openuv380-10w-aes${{ matrix.aes }}-debug
          retention-days: 2
          path: |
            MDUV380_firmware/build/*.elf
            MDUV380_firmware/build/*.map

  # AES-fix1 A2: ДВІ прошивки-кандидати на базі збірки aes (ENABLE_AES=1, без нічого іншого) для польової
  # звірки зі стоковою TYT. Різниця ЛИШЕ в тому, який MI наша передача кладе в late entry:
  #   openuv380-10w-aes-mi-next    -- MI НАСТУПНОГО суперфрейму (look-ahead; так було досі);
  #   openuv380-10w-aes-mi-current -- MI ПОТОЧНОГО суперфрейму (AES_TX_MI_CURRENT=1).
  # Приймач в обох однаковий (приймає MI з ефіру й сам вчить конвенцію). Звичайна збірка aes вище
  # (openuv380-10w-aes1) лишається без змін і збігається з aes-mi-next байт-у-байт за кодом.
  build-aes-mi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ["next", "current"]
    name: build (aes-mi-${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: Build
        working-directory: MDUV380_firmware
        run: |
          if [ "${{ matrix.variant }}" = "current" ]; then CUR=1; else CUR=0; fi
          make -j$(nproc) ENABLE_AES=1 AES_TX_MI_CURRENT=$CUR
      - name: Report size
        working-directory: MDUV380_firmware
        run: arm-none-eabi-size build/openuv380-10w.elf
      - name: Звіт про пам'ять (RAM/CCMRAM, топ-20 об'єктів)
        working-directory: MDUV380_firmware
        run: python3 tools/mem_report.py build/openuv380-10w.elf --top 20
      - name: Перевірити, що перемикач справді (не)ввімкнено в збірці
        working-directory: MDUV380_firmware
        run: |
          # у .bin немає прапорців; перевіряємо, що Makefile передав -D саме так, як треба
          if [ "${{ matrix.variant }}" = "current" ]; then
            make -n -B ENABLE_AES=1 AES_TX_MI_CURRENT=1 | grep -q -- "-DAES_TX_MI_CURRENT" || { echo "ПОМИЛКА: -DAES_TX_MI_CURRENT не передано"; exit 1; }
          else
            ! make -n -B ENABLE_AES=1 AES_TX_MI_CURRENT=0 | grep -q -- "-DAES_TX_MI_CURRENT" || { echo "ПОМИЛКА: -DAES_TX_MI_CURRENT зайвий"; exit 1; }
          fi
          echo "OK: aes-mi-${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: openuv380-10w-aes-mi-${{ matrix.variant }}
          retention-days: 2
          compression-level: 9
          path: |
            MDUV380_firmware/build/*.bin
            MDUV380_firmware/build/*.hex

  # Українська збірка: окрема робота, а не ще один пункт матриці вище, щоб не чіпати
  # наявні перевірки. Дає готовий .bin, який можна прошити з будь-якої ОС -- локальний
  # тулчейн для цього не потрібен (а на Windows/macOS збірка й неможлива: Makefile
  # викликає tools/codec_cleaner.Linux, x86-64 ELF).
  build-ukrainian:
    runs-on: ubuntu-latest
    name: build (українська, ENABLE_AES=1 ENABLE_DMR_DATA=1)
    # contents: write -- лише для публікації .bin у GitHub Release (крок нижче). Release-assets
    # НЕ входять у квоту сховища артефактів Actions, тож прошивку можна забрати навіть тоді,
    # коли upload-artifact падає на "Artifact storage quota has been hit".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: Build
        working-directory: MDUV380_firmware
        # ENABLE_APRS_RX=1 -- R8 (2026-10-11): справжній фоновий приймач APRS (Опції рації -> «APRS станції»,
        # банер, повідомлення нам). Діагностичний екран «APRS проба» (ENABLE_APRS_RX_PROBE) у користувацьку
        # збірку НЕ входить -- він у окремій роботі build-ukrainian-diag нижче.
        run: make -j$(nproc) LANGUAGE_UKRAINIAN=1 ENABLE_AES=1 ENABLE_DMR_DATA=1 ENABLE_CALL_REPLAY=1 ENABLE_APRS_RX=1
      - name: Report size
        working-directory: MDUV380_firmware
        run: arm-none-eabi-size build/openuv380-10w.elf
      - name: Звіт про пам'ять (RAM/CCMRAM, топ-20 об'єктів)
        working-directory: MDUV380_firmware
        run: python3 tools/mem_report.py build/openuv380-10w.elf --top 20
      # Артефакт вивантажуємо ДО перевірок: якщо якась із них колись спрацює хибно,
      # зібраний .bin все одно має лишитись доступним для завантаження.
      # .bin і .hex -- завжди; .elf і .map -- лише при ручному запуску (workflow_dispatch).
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: openuv380-10w-ukrainian
          retention-days: 2
          compression-level: 9
          path: |
            MDUV380_firmware/build/*.bin
            MDUV380_firmware/build/*.hex
      # R10-fix4: для користувацької збірки .elf + .map вивантажуються ЗАВЖДИ (адреси зі звіту про збій розшифровуються
      # лише за .map ТОГО САМОГО коміту: MDUV380_firmware/tools/fault_lookup.py). Окрім артефакту (квота!), .map і .elf
      # кладуться ще й у GitHub Release (крок нижче) -- їх забирає `gh release download`.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: openuv380-10w-ukrainian-debug
          retention-days: 2
          path: |
            MDUV380_firmware/build/*.elf
            MDUV380_firmware/build/*.map
      - name: Assert codec-merge-capable size
        working-directory: MDUV380_firmware
        run: |
          sz=$(stat -c%s build/openuv380-10w.bin)
          echo "firmware .bin size: $sz bytes"
          test "$sz" -ge 728876 || { echo "ERROR: .bin too small to receive the AMBE codec merge (FM-only)"; exit 1; }
          echo "OK: reserved codec region present, ready for flash-time merge."
      - name: Assert Ukrainian strings are actually linked in
        working-directory: MDUV380_firmware
        run: |
          # "Мова" (menu language) у cp1251 -- саме так рядки лежать у ukrainian.h.
          # Якщо прапорець не спрацював, у прошивці буде англійський "Language".
          python3 - <<'PY'
          data = open("build/openuv380-10w.bin","rb").read()
          needle = "Мова".encode("cp1251")
          assert needle in data, "українських рядків у .bin немає -- LANGUAGE_UKRAINIAN=1 не спрацював"
          print("OK: українські рядки знайдено у прошивці")
          PY
      # Публікація в GitHub Release -- ПІСЛЯ перевірок вище, тож у реліз потрапляє лише
      # прошивка, що пройшла і розмір, і наявність українських рядків.
      # Тег ci-<короткий sha>, prerelease. Створюємо, якщо його ще немає (повторний запуск
      # того самого коміту лише перезаписує файл через --clobber). Лише push у main і ручний
      # запуск: для PR і інших гілок реліз не потрібен (і токен PR з форку -- лише читання).
      - name: Опублікувати .bin у GitHub Release (ci-<sha>)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: MDUV380_firmware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          TAG="ci-${SHORT}"
          ASSET="openuv380-10w-ukrainian-${SHORT}.bin"
          cp build/openuv380-10w.bin "$ASSET"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "CI ${SHORT} (${GITHUB_REF_NAME})" \
              --notes "Автоматична CI-збірка коміту ${GITHUB_SHA}. Прошивка: українська, ENABLE_AES=1 ENABLE_DMR_DATA=1 ENABLE_CALL_REPLAY=1 ENABLE_APRS_RX=1 (фоновий приймач APRS). Діагностична збірка з екраном «APRS проба» -- окремий файл openuv380-10w-ukrainian-diag-${SHORT}.bin. Windows-прошивальник (.exe) додається лише при ручному запуску workflow. НЕ перевірено на залізі."
          fi
          gh release upload "$TAG" "$ASSET" --clobber
          echo "OK: $ASSET -> реліз $TAG"
      # R10-fix6: .map і .elf ТІЄЇ САМОЇ збірки, що й .bin вище, -- окремим кроком (щоб його було видно в логах), імена за тим самим
      # шаблоном: openuv380-10w-ukrainian-<sha>.map / .elf. Без них адреси зі звіту про збій (HardFault PC/LR) розшифрувати нічим:
      # tools/fault_lookup.py читає .map, arm-none-eabi-addr2line -- .elf, а обидва мають бути від ТОГО САМОГО коміту й тулчейну.
      - name: Додати .map і .elf до релізу ci-<sha>
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: MDUV380_firmware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          TAG="ci-${SHORT}"
          cp build/openuv380-10w.map "openuv380-10w-ukrainian-${SHORT}.map"
          cp build/openuv380-10w.elf "openuv380-10w-ukrainian-${SHORT}.elf"
          gh release upload "$TAG" "openuv380-10w-ukrainian-${SHORT}.map" "openuv380-10w-ukrainian-${SHORT}.elf" --clobber
          echo "OK: .map і .elf -> реліз $TAG; активи релізу зараз:"
          gh release view "$TAG" --json assets -q '.assets[].name'
      # Автоочистка: лишаємо 5 найновіших ci-* релізів, старіші видаляємо разом із тегом.
      # continue-on-error: невдале прибирання не повинно червонити збірку.
      - name: Прибрати старі ci-* релізи (лишити 5)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OLD=$(gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("ci-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName')
          for T in $OLD; do
            gh release delete "$T" --yes --cleanup-tag
            echo "видалено реліз $T"
          done
          echo "OK: лишилось не більше 5 ci-* релізів"

  # R8: ДІАГНОСТИЧНА збірка -- та сама користувацька, ПЛЮС екран «APRS проба» (R2-R7: сторінки пакетів,
  # фону, потоку, фази, скан T_start, USB-запис). ENABLE_APRS_RX_PROBE включає приймач (на час проби він
  # призупиняється). Окремий файл у тому самому релізі ci-<sha>; користувацька прошивка (build-ukrainian)
  # проби не містить. Залежить від build-ukrainian: реліз ci-<sha> створює вона.
  build-ukrainian-diag:
    needs: build-ukrainian
    runs-on: ubuntu-latest
    name: build (діагностична, APRS проба + приймач)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"
      - name: Build
        working-directory: MDUV380_firmware
        # БЕЗ ENABLE_CALL_REPLAY: проба (s_probe) + приймач (s_rx) разом не вміщуються в CCM поруч із кільцем
        # «Переслухати» (13,5 КБ) -- ld: CCMRAM overflowed by 1596 B (виміряно R8). Користувацька збірка
        # (build-ukrainian) має і «Переслухати», і приймач, але без проби.
        run: make -j$(nproc) LANGUAGE_UKRAINIAN=1 ENABLE_AES=1 ENABLE_DMR_DATA=1 ENABLE_APRS_RX_PROBE=1
      - name: Report size
        working-directory: MDUV380_firmware
        run: arm-none-eabi-size build/openuv380-10w.elf
      - name: Звіт про пам'ять (RAM/CCMRAM, топ-20 об'єктів)
        working-directory: MDUV380_firmware
        run: python3 tools/mem_report.py build/openuv380-10w.elf --top 20
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: openuv380-10w-ukrainian-diag
          retention-days: 2
          compression-level: 9
          path: |
            MDUV380_firmware/build/*.bin
            MDUV380_firmware/build/*.hex
      - name: Assert Ukrainian strings are actually linked in
        working-directory: MDUV380_firmware
        run: |
          python3 - <<'PY'
          data = open("build/openuv380-10w.bin","rb").read()
          needle = "Мова".encode("cp1251")
          assert needle in data, "українських рядків у .bin немає -- LANGUAGE_UKRAINIAN=1 не спрацював"
          print("OK: українські рядки знайдено у прошивці")
          PY
      - name: Додати діагностичний .bin до релізу ci-<sha>
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: MDUV380_firmware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          TAG="ci-${SHORT}"
          ASSET="openuv380-10w-ukrainian-diag-${SHORT}.bin"
          cp build/openuv380-10w.bin "$ASSET"
          gh release upload "$TAG" "$ASSET" --clobber
          echo "OK: $ASSET -> реліз $TAG"
      # R10-fix6: .map і .elf діагностичної збірки (інша прошивка -> інший .map, тож імена з "diag", як і в .bin).
      - name: Додати .map і .elf діагностичної збірки до релізу ci-<sha>
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: MDUV380_firmware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          TAG="ci-${SHORT}"
          cp build/openuv380-10w.map "openuv380-10w-ukrainian-diag-${SHORT}.map"
          cp build/openuv380-10w.elf "openuv380-10w-ukrainian-diag-${SHORT}.elf"
          gh release upload "$TAG" "openuv380-10w-ukrainian-diag-${SHORT}.map" "openuv380-10w-ukrainian-diag-${SHORT}.elf" --clobber
          echo "OK: .map і .elf (diag) -> реліз $TAG; активи релізу зараз:"
          gh release view "$TAG" --json assets -q '.assets[].name'

  # GUI-прошивальник для простих користувачів/тестерів: один .exe із двома кнопками
  # ("Обрати донор" і "ПРОШИТИ"), без ручного pip install/копіювання libusb dll.
  # Залежить від build-ukrainian -- бере вже готовий .bin і вбудовує його прямо в .exe,
  # тож тестеру не треба окремо шукати артефакт прошивки. Тулчейн для .exe є тільки на
  # windows-latest (PyInstaller збирає під ту ОС, на якій запущений).
  # На кожен push у main і при ручному запуску: готовий прошивальник можна взяти прямо з
  # GitHub (Actions -> run -> Artifacts, або Releases -> ci-<sha>). Квоту тримає в межах
  # retention-days: 2 нижче; .exe також лежить у релізі ci-<sha>, який до квоти не входить.
  build-gui-flasher:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build-ukrainian
    runs-on: windows-latest
    name: build (GUI-прошивальник, Windows .exe)
    # contents: write -- щоб додати .exe до релізу ci-<sha>, який створив build-ukrainian.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # .bin беремо з релізу ci-<sha> (його щойно опублікував build-ukrainian), а НЕ з
      # артефакту: при вичерпаній квоті артефакт не вивантажується, і download-artifact падав.
      - name: Завантажити .bin із релізу ci-<sha>
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          mkdir -p firmware
          gh release download "ci-${SHORT}" --pattern "openuv380-10w-ukrainian-${SHORT}.bin" -D firmware --clobber
          mv "firmware/openuv380-10w-ukrainian-${SHORT}.bin" firmware/openuv380-10w.bin
          ls -l firmware
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python-залежності
        shell: bash
        run: pip install pyinstaller pyusb pyserial libusb cryptography
      - name: Підготувати файли для вбудовування (прошивка, libusb dll, підпис збірки)
        shell: bash
        working-directory: MDUV380_firmware/tools
        run: |
          cp ../../firmware/openuv380-10w.bin .

          # libusb-1.0.dll: той самий трюк, що й при ручній прошивці з Windows (див.
          # BUILD.md) -- пакет 'libusb' з PyPI не кладе dll в PATH сам, треба знайти
          # її вручну під потрібну розрядність.
          python -c "
          import libusb, os, glob, shutil
          base = os.path.join(os.path.dirname(libusb.__file__), '_platform')
          cands = [p for p in glob.glob(os.path.join(base, '**', 'libusb-1.0.dll'), recursive=True)
                   if os.path.basename(os.path.dirname(p)).lower() in ('x64', 'x86_64', 'amd64')]
          assert cands, 'libusb-1.0.dll не знайдено в пакеті libusb'
          shutil.copy(cands[0], 'libusb-1.0.dll')
          print('libusb-1.0.dll <-', cands[0])
          "

          echo "коміт $(git rev-parse --short HEAD), зібрано $(date -u +%Y-%m-%d)" > build_info.txt
          cat build_info.txt
      - name: Зібрати .exe (PyInstaller, onefile)
        shell: bash
        working-directory: MDUV380_firmware/tools
        run: |
          pyinstaller --onefile --windowed --name "TYT MD-UV390UKR" \
            --icon app_icon.ico \
            --version-file version_info.txt \
            --hidden-import usb.backend.libusb1 \
            --hidden-import cryptography.hazmat.bindings._rust \
            --add-data "openuv380-10w.bin;." \
            --add-data "libusb-1.0.dll;." \
            --add-data "build_info.txt;." \
            gui_flasher.py
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: openuv380-flasher-windows
          retention-days: 2
          path: MDUV380_firmware/tools/dist/TYT MD-UV390UKR.exe
      # Той самий .exe -- у реліз ci-<sha> поруч із .bin (не залежить від квоти артефактів).
      # Увага: GitHub у назвах release-assets замінює пробіли крапками, тож у релізі файл
      # називатиметься "TYT.MD-UV390UKR.exe".
      - name: Додати .exe до релізу ci-<sha>
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="ci-${GITHUB_SHA::7}"
          gh release upload "$TAG" "MDUV380_firmware/tools/dist/TYT MD-UV390UKR.exe" --clobber
          echo "OK: .exe -> реліз $TAG"
